{% extends 'base.html' %}{% block content %}<div class="card mx-auto p-4" style="max-width:440px"><h2>Administrator login</h2><p class="text-muted">Authorized Luztow staff only.</p>{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><div class="mb-3"><label>Username</label><input class="form-control" name="username" autocomplete="username" required></div><div class="mb-3"><label>Password</label><input type="password" class="form-control" name="password" autocomplete="current-password" required></div><button class="btn btn-primary w-100">Sign in</button></form></div>{% endblock %}

{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luztow Invoice Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{% static 'css/style.css' %}" rel="stylesheet"></head><body><nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">LUZTOW · INVOICES</a>{% if user.is_authenticated %}<div class="d-flex gap-3 align-items-center"><a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'customers' %}">Customers</a><a href="{% url 'invoice_list' %}">Invoices</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Log out</button></form></div>{% endif %}</div></nav><main class="container py-4">{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>

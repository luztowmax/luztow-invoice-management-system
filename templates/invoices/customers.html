{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Customers</h2><a class="btn btn-primary" href="{% url 'customer_new' %}">+ Add customer</a></div><table class="table table-striped"><tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr>{% for c in customers %}<tr><td>{{ c.name }}</td><td>{{ c.email }}</td><td>{{ c.phone }}</td><td><a href="{% url 'customer_edit' c.pk %}">Edit</a></td></tr>{% empty %}<tr><td colspan="4">No customers.</td></tr>{% endfor %}</table>{% endblock %}
